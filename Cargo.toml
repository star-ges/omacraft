[package]
name = "omacraft"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/star-ges/omacraft"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["file", "gif", "image", "svg", "webp"] }
fastnbt = "2.6.3"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.190"
md-5 = "0.11.0"
percent-encoding = "2.3.2"
reflink-copy = "0.1.30"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "gzip", "form", "multipart"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
toml = "1.1.8"
# Already built for proc-macro-crate; reads TOML configs with the position of every
# value and comment, so edits can leave the rest of a file untouched.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
# Deflate covers jars, Prism/MultiMC zips and .mrpacks; Deflate64 is what Windows
# Explorer writes for big archives. The rest of zip's codecs (zopfli, bzip2, zstd,
# lzma/xz, ppmd, AES) only cost binary size.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "time"] }

[profile.release]
# Full LTO with one codegen unit saved 7 MB (35 to 28) but tripled build times, so it's off.
strip = true
